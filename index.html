<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قائمة الطعام</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f12; 
      --header-bg: #18181c; 
      --card-bg: #1c1c21;
      --accent: #e5b849; 
      --accent-gradient: linear-gradient(135deg, #f39c12, #d4af37);
      --text: #ffffff; 
      --text-muted: #a5a5ab; 
      --border: rgba(255, 255, 255, 0.08);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    header { 
      background: var(--header-bg); 
      padding: 20px 15px; 
      text-align: center; 
      border-bottom: 1px solid var(--border); 
      margin-bottom: 20px;
    }
    .brand { 
      font-size: 1.8rem; 
      font-weight: 800; 
      background: var(--accent-gradient); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }

    .container { padding: 0 15px; max-width: 850px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    
    .card { 
      background: var(--card-bg); 
      border-radius: 18px; 
      overflow: hidden; 
      border: 1px solid var(--border); 
      box-shadow: var(--shadow); 
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .img-wrapper { width: 100%; height: 130px; background: #23232a; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 12px; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .card-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.3; }
    .card-price { color: var(--accent); font-weight: 800; font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="brand">قائمة الوجبات</div>
  </header>

  <div class="container">
    <div class="grid" id="menuGrid">
      
      <!-- يمكنك تعديل أو إضافة الوجبات هنا بكل سهولة -->
      <!-- لاحظ وجود data-id لكل وجبة لكي يتعرف عليها الفايربيس بدقة -->
      
      <div class="card" data-id="item_burger_classic">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" alt="برجر كلاسيك">
        </div>
        <div class="card-info">
          <div class="card-title">برجر كلاسيك</div>
          <div class="card-desc">شريحة لحم بقر مع الجبن والصوص الخاص</div>
          <div class="card-price">7,000 د.ع</div>
        </div>
      </div>

      <div class="card" data-id="item_burger_zinger">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1625813506062-0aeb1d7a094b?w=500" alt="برجر زنجر">
        </div>
        <div class="card-info">
          <div class="card-title">برجر زنجر دجاج</div>
          <div class="card-desc">صدر دجاج مقرمش مع الخس والصوص الحار</div>
          <div class="card-price">6,500 د.ع</div>
        </div>
      </div>

      <div class="card" data-id="item_pizza_pepperoni">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500" alt="بيتزا ببروني">
        </div>
        <div class="card-info">
          <div class="card-title">بيتزا ببروني</div>
          <div class="card-desc">جبنة موزاريلا مع شرائح الببروني الفاخرة</div>
          <div class="card-price">10,000 د.ع</div>
        </div>
      </div>

      <div class="card" data-id="item_shawarma_plate">
        <div class="img-wrapper">
          <img src="https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500" alt="صاج شاورما">
        </div>
        <div class="card-info">
          <div class="card-title">وجبة شاورما عربي</div>
          <div class="card-desc">تقطيع صاج مع الثومية والبطاطا والطرشي</div>
          <div class="card-price">8,000 د.ع</div>
        </div>
      </div>

    </div>
  </div>

  <!-- ⚡ سكريبت الربط والمزامنة مع لوحة التحكم Firebase ⚡ -->
  <script>
    const API_BASE_URL = "https://admin-e3293-default-rtdb.firebaseio.com/";
    // اسم الملف المسجل بـ admin.html (بدون .html)
    const MENU_FILE_NAME = "index"; 

    // 1. مزامنة فهرس أسماء الوجبات وإرسالها للوحة التحكم تلقائياً
    async function syncCatalogToAdmin() {
      let catalogData = {};
      
      document.querySelectorAll('.card').forEach((card, index) => {
        let itemId = card.getAttribute('data-id') || `item_${index}`;
        let titleElement = card.querySelector('.card-title');
        let itemName = titleElement ? titleElement.innerText.trim() : `وجبة ${index + 1}`;
        
        catalogData[itemId] = itemName;
      });

      if (Object.keys(catalogData).length > 0) {
        try {
          await fetch(`${API_BASE_URL}catalog_${MENU_FILE_NAME}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(catalogData)
          });
        } catch(e) {
          console.error("خطأ في رفع الفهرس:", e);
        }
      }
    }

    // 2. قراءة حالة الإخفاء من Firebase وإخفاء الوجبة من الشاشة
    async function applyHiddenItems() {
      try {
        const res = await fetch(`${API_BASE_URL}items_${MENU_FILE_NAME}.json?nocache=` + Date.now());
        const menuStatus = await res.json() || {};

        document.querySelectorAll('.card').forEach((card, index) => {
          let itemId = card.getAttribute('data-id') || `item_${index}`;
          if (menuStatus[itemId] === 'soldout') {
            card.style.display = 'none'; // إخفاء الوجبة
          } else {
            card.style.display = 'block'; // إظهار الوجبة
          }
        });
      } catch(e) {
        console.error("خطأ في جلب حالة الإخفاء:", e);
      }
    }

    // تشغيل المزامنة والتحديث فور فتح الصفحة
    document.addEventListener('DOMContentLoaded', async () => {
      await syncCatalogToAdmin();
      await applyHiddenItems();
    });
  </script>
</body>
</html>
