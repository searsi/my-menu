<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Menu</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #007bff;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }
    /* هيدر أزرار اللغة */
    .top-bar {
      background: #555;
      padding: 12px;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .lang-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .lang-btn.active {
      background: white;
      color: #333;
    }
    /* شريط الأقسام الأفقي */
    .nav-scroller {
      background: white;
      overflow-x: auto;
      white-space: nowrap;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .nav-scroller a {
      display: inline-block;
      padding: 8px 16px;
      color: #555;
      text-decoration: none;
      font-weight: 600;
    }
    /* حاوية المنيو */
    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .section-title {
      border-bottom: 2px solid #333;
      padding-bottom: 5px;
      margin-top: 30px;
    }
    /* بطاقة المنتج */
    .menu-item {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .menu-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    .item-info {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-title { font-weight: bold; font-size: 1.1rem; }
    .item-price { color: #666; font-weight: 600; }
  </style>
</head>
<body>

  <!-- شريط اختيار اللغة -->
  <div class="top-bar">
    <button class="lang-btn" onclick="setLanguage('en')">English</button>
    <button class="lang-btn active" onclick="setLanguage('ar')">العربية</button>
  </div>

  <!-- شريط التنقل بين الأقسام -->
  <div class="nav-scroller">
    <a href="#hot-coffee" data-ar="قهوة حارة" data-en="Hot Coffee">قهوة حارة</a>
    <a href="#cold-coffee" data-ar="قهوة باردة" data-en="Cold Coffee">قهوة باردة</a>
  </div>

  <!-- الأقسام والمنتجات -->
  <div class="container">
    
    <!-- قسم القهوة الحارة -->
    <h2 id="hot-coffee" class="section-title" data-ar="قهوة حارة" data-en="Hot Coffee">قهوة حارة</h2>
    
    <div class="menu-item">
      <img src="https://via.placeholder.com/400x200" alt="Espresso">
      <div class="item-info">
        <span class="item-title" data-ar="إسبريسو" data-en="Espresso">إسبريسو</span>
        <span class="item-price">2000 IQD</span>
      </div>
    </div>

    <!-- قسم القهوة الباردة -->
    <h2 id="cold-coffee" class="section-title" data-ar="قهوة باردة" data-en="Cold Coffee">قهوة باردة</h2>
    
    <div class="menu-item">
      <img src="https://via.placeholder.com/400x200" alt="Iced Latte">
      <div class="item-info">
        <span class="item-title" data-ar="آيس لاتيه" data-en="Iced Latte">آيس لاتيه</span>
        <span class="item-price">4000 IQD</span>
      </div>
    </div>

  </div>

  <!-- كود الجافاسكريبت للتبديل بين اللغات -->
  <script>
    function setLanguage(lang) {
      // تغيير اتجاه الصفحة
      document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      
      // تحديث النصوص بناءً على اللغة المختارة
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });

      // تغيير شكل زر اللغة النشط
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
