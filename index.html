<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karak Cafe Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --text: #ffffff;
      --text-muted: #aaaaaa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding-bottom: 30px; }

    /* الهيدر والاختيارات */
    header {
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%);
      padding: 20px 15px 10px;
      text-align: center;
      border-bottom: 1px solid #2d2d2d;
    }
    .logo-title { font-size: 1.6rem; color: var(--accent); font-weight: 700; margin-bottom: 15px; }

    /* أزرار اللغات */
    .lang-container { display: flex; justify-content: center; gap: 8px; margin-bottom: 15px; }
    .lang-btn {
      background: #2a2a2a; color: #fff; border: 1px solid #444;
      padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: 0.3s;
    }
    .lang-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }

    /* شريط الأقسام */
    .categories-bar {
      display: flex; gap: 10px; overflow-x: auto; padding: 10px 15px;
      scrollbar-width: none; border-bottom: 1px solid #222; position: sticky; top: 0; background: var(--bg-color); z-index: 100;
    }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-item {
      white-space: nowrap; background: #1a1a1a; color: var(--text-muted); padding: 8px 18px;
      border-radius: 12px; font-weight: 600; text-decoration: none; border: 1px solid #2a2a2a; font-size: 0.9rem;
    }
    .cat-item.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* الشبكة (Grid Layout) */
    .container { padding: 15px; max-width: 800px; margin: 0 auto; }
    .section-header { font-size: 1.3rem; color: var(--accent); margin: 25px 0 15px; padding-right: 10px; border-right: 4px solid var(--accent); }
    html[dir="ltr"] .section-header { padding-right: 0; padding-left: 10px; border-right: none; border-left: 4px solid var(--accent); }

    .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }

    .card {
      background: var(--card-bg); border-radius: 16px; overflow: hidden;
      border: 1px solid #292929; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card img { width: 100%; height: 120px; object-fit: cover; }
    .card-body { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
    .card-price { color: var(--accent); font-weight: 700; font-size: 0.9rem; direction: ltr; text-align: left; }
    html[dir="rtl"] .card-price { text-align: right; }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">KARAK CAFÉ</div>
    <div class="lang-container">
      <button class="lang-btn active" onclick="setLang('ar')">العربية</button>
      <button class="lang-btn" onclick="setLang('en')">English</button>
      <button class="lang-btn" onclick="setLang('ku')">کوردی</button>
    </div>
  </header>

  <div class="categories-bar">
    <a href="#hot" class="cat-item active" data-ar="قهوة حارة" data-en="Hot Coffee" data-ku="قاوەی گەرم">قهوة حارة</a>
    <a href="#cold" class="cat-item" data-ar="قهوة باردة" data-en="Cold Coffee" data-ku="قاوەی سارد">قهوة باردة</a>
    <a href="#mojito" class="cat-item" data-ar="موهيتو" data-en="Mojito" data-ku="مۆهیتۆ">موهيتو</a>
  </div>

  <div class="container">
    
    <!-- قسم القهوة الحارة -->
    <div id="hot" class="section-header" data-ar="قهوة حارة" data-en="Hot Coffee" data-ku="قاوەی گەرم">قهوة حارة</div>
    <div class="grid-menu">
      
      <div class="card">
        <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400" alt="Espresso">
        <div class="card-body">
          <div class="card-title" data-ar="إسبريسو" data-en="Espresso" data-ku="ئێسپریسۆ">إسبريسو</div>
          <div class="card-price">2,000 IQD</div>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1534778101976-62847782c213?w=400" alt="Cappuccino">
        <div class="card-body">
          <div class="card-title" data-ar="كابوتشينو" data-en="Cappuccino" data-ku="كابوچينۆ">كابوتشينو</div>
          <div class="card-price">4,000 IQD</div>
        </div>
      </div>

    </div>

    <!-- قسم القهوة الباردة -->
    <div id="cold" class="section-header" data-ar="قهوة باردة" data-en="Cold Coffee" data-ku="قاوەی سارد">قهوة باردة</div>
    <div class="grid-menu">
      
      <div class="card">
        <img src="https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=400" alt="Iced Latte">
        <div class="card-body">
          <div class="card-title" data-ar="آيس لاتيه" data-en="Iced Latte" data-ku="ئایس لاتیه">آيس لاتيه</div>
          <div class="card-price">4,000 IQD</div>
        </div>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=400" alt="Iced Spanish Latte">
        <div class="card-body">
          <div class="card-title" data-ar="آيس سبانيش لاتيه" data-en="Iced Spanish Latte" data-ku="ئایس سپانیش لاتیه">آيس سبانيش لاتيه</div>
          <div class="card-price">4,000 IQD</div>
        </div>
      </div>

    </div>

  </div>

  <script>
    function setLang(lang) {
      document.documentElement.dir = (lang === 'ar' || lang === 'ku') ? 'rtl' : 'ltr';
      
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });

      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
