<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karak Cafe - Live Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --accent: #d4af37;
      --text: #ffffff;
      --text-muted: #a0a0a0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }

    header {
      background: #1a1a1a; padding: 20px 15px 10px; text-align: center;
      border-bottom: 1px solid #2d2d2d; sticky: top;
    }
    .brand { font-size: 1.8rem; color: var(--accent); font-weight: 700; margin-bottom: 10px; }

    /* أزرار اللغات */
    .langs { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
    .lang-btn {
      background: #2a2a2a; color: #fff; border: 1px solid #444;
      padding: 5px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer;
    }
    .lang-btn.active { background: var(--accent); color: #000; font-weight: bold; border-color: var(--accent); }

    /* حقل البحث */
    .search-box {
      width: 100%; max-width: 500px; margin: 10px auto 0; padding: 10px 15px;
      border-radius: 25px; border: 1px solid #333; background: #252525; color: #fff; outline: none;
    }

    /* شريط التناقل */
    .nav-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 12px 15px;
      position: sticky; top: 0; background: var(--bg); z-index: 90; border-bottom: 1px solid #222;
      scrollbar-width: none;
    }
    .nav-bar::-webkit-scrollbar { display: none; }
    .nav-link {
      white-space: nowrap; background: #1f1f1f; color: var(--text-muted);
      padding: 6px 14px; border-radius: 12px; text-decoration: none; font-size: 0.85rem; border: 1px solid #2e2e2e;
    }

    .container { padding: 15px; max-width: 800px; margin: 0 auto; }
    .sec-title { font-size: 1.2rem; color: var(--accent); margin: 25px 0 12px; border-right: 4px solid var(--accent); padding-right: 8px; }
    html[dir="ltr"] .sec-title { border-right: none; border-left: 4px solid var(--accent); padding-left: 8px; }

    /* بطاقات المنيو */
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card {
      background: var(--card-bg); border-radius: 14px; overflow: hidden;
      border: 1px solid #282828; cursor: pointer; transition: transform 0.2s;
    }
    .card:active { transform: scale(0.98); }
    .card img { width: 100%; height: 110px; object-fit: cover; }
    .card-info { padding: 10px; }
    .card-title { font-size: 0.88rem; font-weight: 600; line-height: 1.2; height: 32px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-price { color: var(--accent); font-weight: bold; margin-top: 6px; font-size: 0.85rem; }

    /* النافذة المنبثقة Modal */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 1000; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #1e1e1e; border-radius: 18px; max-width: 400px; width: 100%;
      overflow: hidden; border: 1px solid #333; position: relative;
    }
    .modal-content img { width: 100%; height: 200px; object-fit: cover; }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 8px; }
    .modal-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 15px; }
    .modal-price { font-size: 1.1rem; color: var(--accent); font-weight: bold; }
    .close-btn { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #fff; border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
    html[dir="ltr"] .close-btn { left: auto; right: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">KARAK CAFÉ</div>
    <div class="langs">
      <button class="lang-btn active" onclick="setLang('ar')">العربية</button>
      <button class="lang-btn" onclick="setLang('en')">English</button>
      <button class="lang-btn" onclick="setLang('ku')">کوردی</button>
    </div>
    <input type="text" id="searchInput" class="search-box" placeholder="بحث عن منتج..." onkeyup="filterMenu()">
  </header>

  <div class="nav-bar">
    <a href="#hot" class="nav-link" data-ar="قهوة حارة" data-en="Hot Coffee" data-ku="قاوەی گەرم">قهوة حارة</a>
    <a href="#cold" class="nav-link" data-ar="قهوة باردة" data-en="Cold Coffee" data-ku="قاوەی سارد">قهوة باردة</a>
    <a href="#tea" class="nav-link" data-ar="شاي وحليب" data-en="Tea" data-ku="چا">شاي وحليب</a>
    <a href="#mojito" class="nav-link" data-ar="موهيتو" data-en="Mojito" data-ku="مۆهیتۆ">موهيتو</a>
    <a href="#healthy" class="nav-link" data-ar="عصائر صحية" data-en="Healthy Juice" data-ku="شەربەتی تەندروست">عصائر صحية</a>
  </div>

  <div class="container">
    <!-- قسم القهوة الحارة -->
    <div id="hot" class="sec-title" data-ar="قهوة حارة" data-en="Hot Coffee" data-ku="قاوەی گەرم">قهوة حارة</div>
    <div class="grid">
      <div class="card" onclick="openModal('إسبريسو', 'Espresso', '2,000 IQD', 'https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400', '')">
        <img src="https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=400">
        <div class="card-info">
          <div class="card-title" data-ar="إسبريسو" data-en="Espresso" data-ku="ئێسپریسۆ">إسبريسو</div>
          <div class="card-price">2,000 IQD</div>
        </div>
      </div>
      <div class="card" onclick="openModal('قهوة تركية', 'Turkish Coffee', '3,000 IQD', 'https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400', '')">
        <img src="https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=400">
        <div class="card-info">
          <div class="card-title" data-ar="قهوة تركية" data-en="Turkish Coffee" data-ku="قاوەی تورکی">قهوة تركية</div>
          <div class="card-price">3,000 IQD</div>
        </div>
      </div>
    </div>

    <!-- قسم الشاي -->
    <div id="tea" class="sec-title" data-ar="شاي وحليب" data-en="Tea" data-ku="چا">شاي وحليب</div>
    <div class="grid">
      <div class="card" onclick="openModal('شاي كرك', 'Karak Tea', '2,000 IQD', 'https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400', 'شاي كرك أصلي بالطريقة الهندية مع الهيل والزعفران')">
        <img src="https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400">
        <div class="card-info">
          <div class="card-title" data-ar="شاي كرك" data-en="Karak Tea" data-ku="چای کەرەک">شاي كرك</div>
          <div class="card-price">2,000 IQD</div>
        </div>
      </div>
    </div>

    <!-- قسم العصائر الصحية -->
    <div id="healthy" class="sec-title" data-ar="عصائر صحية" data-en="Healthy Juice" data-ku="شەربەتی تەندروست">عصائر صحية</div>
    <div class="grid">
      <div class="card" onclick="openModal('برتقال، ليمون وزنجبيل', 'Orange, Lemon & Ginger', '4,000 IQD', 'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=400', 'يقوي المناعة وينعش الجسم (فيتامين C)')">
        <img src="https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=400">
        <div class="card-info">
          <div class="card-title" data-ar="برتقال، ليمون وزنجبيل" data-en="Orange, Lemon & Ginger" data-ku="پرتەقاڵ، لیمۆ و زەنجەفیل">برتقال، ليمون وزنجبيل</div>
          <div class="card-price">4,000 IQD</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal تفاصيل المنتج -->
  <div id="itemModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <img id="modalImg" src="">
      <div class="modal-body">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalDesc" class="modal-desc"></div>
        <div id="modalPrice" class="modal-price"></div>
      </div>
    </div>
  </div>

  <script>
    let currentLang = 'ar';

    function setLang(lang) {
      currentLang = lang;
      document.documentElement.dir = (lang === 'ar' || lang === 'ku') ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-' + lang + ']').forEach(el => {
        el.textContent = el.getAttribute('data-' + lang);
      });
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    function filterMenu() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('card');
      Array.from(cards).forEach(card => {
        let title = card.innerText.toLowerCase();
        card.style.display = title.includes(input) ? "block" : "none";
      });
    }

    function openModal(titleAr, titleEn, price, imgUrl, desc) {
      document.getElementById('modalTitle').innerText = currentLang === 'en' ? titleEn : titleAr;
      document.getElementById('modalPrice').innerText = price;
      document.getElementById('modalImg').src = imgUrl;
      document.getElementById('modalDesc').innerText = desc || '';
      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('itemModal').style.display = 'none';
    }
  </script>
</body>
</html>
