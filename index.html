<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو الرقمي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background: #121212; color: #fff; padding: 20px; }
    .menu-container { max-width: 500px; margin: 0 auto; }
    .menu-item { background: #1e1e1e; border: 1px solid #333; padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .item-info h3 { margin: 0 0 5px 0; font-size: 1.1rem; color: #e5b849; }
    .item-info p { margin: 0; color: #aaa; font-size: 0.9rem; }
    .price { font-weight: bold; color: #2ed573; }
  </style>
</head>
<body>

  <div class="menu-container">
    <h2 style="text-align: center; margin-bottom: 20px; color: #e5b849;">قائمة الطعام</h2>

    <!-- قائمة الوجبات: لاحظ إضافة data-id و data-name -->
    <div class="menu-item" data-id="item_burger" data-name="برجر كلاسيك">
      <div class="item-info">
        <h3>برجر كلاسيك</h3>
        <p>لحم بقر طازج مع الجبن والصوص الخاص</p>
      </div>
      <span class="price">5,000 د.ع</span>
    </div>

    <div class="menu-item" data-id="item_pizza" data-name="بيتزا ببروني">
      <div class="item-info">
        <h3>بيتزا ببروني</h3>
        <p>صلصة طماطم، جبن موزاريلا، وببروني</p>
      </div>
      <span class="price">8,000 د.ع</span>
    </div>

    <div class="menu-item" data-id="item_crispy" data-name="وجبة كريسبي">
      <div class="item-info">
        <h3>وجبة كريسبي</h3>
        <p>4 قطع دجاج مقرمش مع البطاطا والصلصة</p>
      </div>
      <span class="price">6,500 د.ع</span>
    </div>
  </div>

  <!-- سكربت مزامنة حالة الوجبات وإرسال القائمة لوحة التحكم -->
  <script>
    const API_URL = "https://admin-e3293-default-rtdb.firebaseio.com/";
    // استخراج اسم الملف تلقائياً (مثلاً index)
    const fileName = window.location.pathname.split("/").pop().replace(".html", "") || "index";

    async function syncAndCheckItems() {
      // 1. جمع الوجبات الموجودة في الصفحة وإرسالها لـ Firebase لتظهر باللوحة
      const itemsInPage = {};
      document.querySelectorAll('.menu-item').forEach(el => {
        const id = el.getAttribute('data-id');
        const name = el.getAttribute('data-name') || id;
        itemsInPage[id] = name;
      });

      try {
        // إرسال قائمة الوجبات لتسجيل أسمائها في قاعدة البيانات
        fetch(`${API_URL}catalog_${fileName}.json`, {
          method: 'PUT',
          body: JSON.stringify(itemsInPage)
        });

        // 2. جلب الوجبات المنتهية لإخفائها
        const res = await fetch(`${API_URL}items_${fileName}.json?t=` + Date.now());
        const soldOutData = await res.json();

        if (soldOutData) {
          document.querySelectorAll('.menu-item').forEach(item => {
            const id = item.getAttribute('data-id');
            if (soldOutData[id] === 'soldout') {
              item.style.display = 'none'; // إخفاء الوجبة المنتهية
            } else {
              item.style.display = 'flex'; // إظهار الوجبة المتوفرة
            }
          });
        }
      } catch (e) {
        console.log("خطأ المزامنة:", e);
      }
    }

    syncAndCheckItems();
    setInterval(syncAndCheckItems, 3000); // فحص مستمر كل 3 ثوانٍ
  </script>
</body>
</html>
