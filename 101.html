<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">Iraqi Food & Cafe Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg: #f5f6fa;
      --header-bg: #ffffff;
      --card-bg: #ffffff;
      --accent: #d4af37;
      --accent-gradient: linear-gradient(135deg, #f39c12, #d4af37);
      --text: #2f3640;
      --text-muted: #718093;
      --border: rgba(0, 0, 0, 0.08);
      --search-bg: #f1f2f6;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      --danger: #ff4757;
    }

    body.dark-mode {
      --bg: #0f0f12;
      --header-bg: #18181c;
      --card-bg: #1c1c21;
      --accent: #e5b849;
      --text: #ffffff;
      --text-muted: #a5a5ab;
      --border: rgba(255, 255, 255, 0.08);
      --search-bg: #23232a;
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; transition: background 0.3s, color 0.3s; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }

    /* الواجهة الترحيبية */
    #welcomeView {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .welcome-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px 20px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .restaurant-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--accent);
      margin: 0 auto 15px auto;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
    }
    .welcome-card h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 5px; color: var(--text); }
    .restaurant-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; }
    
    .menu-btn {
      display: block;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1rem;
      text-decoration: none;
      margin-bottom: 12px;
      transition: 0.3s;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
    }
    .btn-ar { background: var(--accent-gradient); color: #fff; }
    .btn-en { background: var(--search-bg); color: var(--accent); border: 2px solid var(--accent) !important; }
    .menu-btn:hover { transform: translateY(-2px); opacity: 0.92; }

    .location-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      background: var(--search-bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      margin-top: 15px;
      margin-bottom: 18px;
      transition: 0.3s;
    }
    .location-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

    .social-section {
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 5px;
    }
    .social-title {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--search-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--accent);
      font-size: 1.2rem;
      text-decoration: none;
      transition: 0.3s;
      border: 1px solid var(--border);
    }
    .social-icon:hover { 
      background: var(--accent); 
      color: #fff; 
      transform: scale(1.1); 
    }

    #mainMenuView { display: none; }

    header { 
      background: var(--header-bg); 
      padding: 15px 20px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border); 
      position: sticky; top: 0; z-index: 100;
      box-shadow: var(--shadow);
    }
    .brand { font-size: 1.4rem; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-controls { display: flex; gap: 10px; align-items: center; }
    .control-btn { background: var(--search-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
    .back-welcome-btn { background: var(--search-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 5px; }

    .container { padding: 15px; max-width: 850px; margin: 0 auto; }
    .search-box { margin-bottom: 15px; position: relative; }
    .search-input {
      width: 100%; padding: 12px 16px; border-radius: 12px;
      border: 1px solid var(--border); background-color: var(--card-bg);
      color: var(--text); font-size: 0.95rem; outline: none; box-shadow: var(--shadow);
    }
    .search-input::placeholder { color: var(--text-muted); }

    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .categories-bar::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; font-weight: 700; font-size: 0.85rem; }
    .cat-btn.active { background: var(--accent-gradient); color: #fff; border: none; }

    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { position: relative; background: var(--card-bg); border-radius: 18px; overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); transition: all 0.3s ease; }
    .img-wrapper { width: 100%; height: 130px; background: #e2e8f0; }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { padding: 12px; }
    .card-title { font-size: 0.95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .card-desc { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; line-height: 1.3; }
    .card-price { color: var(--accent); font-weight: 800; font-size: 1rem; }

    .card.sold-out { opacity: 0.5; filter: grayscale(85%); pointer-events: none; }
    .card.sold-out::after {
      content: attr(data-soldout-text);
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background-color: var(--danger); color: #ffffff; padding: 6px 14px;
      border-radius: 20px; font-size: 0.8rem; font-weight: 800; z-index: 10; white-space: nowrap;
    }

    #expiredOverlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 15, 18, 0.96); backdrop-filter: blur(10px);
      z-index: 99999; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 25px; color: #ffffff;
    }
    .expired-card { background: #1c1c21; border: 1px solid rgba(255, 71, 87, 0.4); border-radius: 24px; padding: 35px 25px; max-width: 420px; width: 90%; }
    .expired-icon { font-size: 3.5rem; margin-bottom: 15px; }
    .expired-title { font-size: 1.4rem; font-weight: 800; color: #ff4757; margin-bottom: 10px; }
    .expired-msg { font-size: 0.95rem; color: #a5a5ab; line-height: 1.6; margin-bottom: 20px; }
    .expired-badge { display: inline-block; background: rgba(255, 71, 87, 0.15); color: #ff4757; border: 1px solid rgba(255, 71, 87, 0.3); padding: 8px 16px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; }
  </style>
</head>
<body class="light-mode">

  <div id="expiredOverlay">
    <div class="expired-card">
      <div class="expired-icon">⚠️</div>
      <div class="expired-title">المنيو خارج الخدمة مؤقتاً</div>
      <div class="expired-msg">عذراً، هذه الخدمة متوقفة حالياً. يرجى مراجعة إدارة المطعم لإعادة التفعيل.</div>
      <div class="expired-badge">حالة الاشتراك: منتهي / Expired</div>
    </div>
  </div>

  <div id="welcomeView">
    <div class="welcome-card">
      <img id="resLogoImg" src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=500" alt="Logo" class="restaurant-logo">
      <h1 id="resTitle">مطعم ومنشأة بغداد</h1>
      <p class="restaurant-desc" id="resDesc">أهلاً بك، اختر لغة القائمة للمتابعة</p>

      <button onclick="selectLanguage('ar')" class="menu-btn btn-ar">📋 المنيو العربي (Arabic Menu)</button>
      <button onclick="selectLanguage('en')" class="menu-btn btn-en">📋 English Menu (المنيو الإنجليزي)</button>

      <a href="#" id="locationLink" class="location-btn" target="_blank" style="display: none;">
        <i class="fas fa-map-marker-alt" style="color: #ff4757;"></i> موقعنا على الخريطة (Location)
      </a>

      <div class="social-section" id="socialSection" style="display: none;">
        <div class="social-title">تابعنا على منصات التواصل</div>
        <div class="social-links" id="socialLinksContainer"></div>
      </div>
    </div>
  </div>

  <div id="mainMenuView">
    <header>
      <div class="brand" id="brandText">مطعم ومنشأة بغداد</div>
      <div class="header-controls">
        <button class="back-welcome-btn" onclick="returnToWelcome()"><i class="fas fa-home"></i> الرئيسية</button>
        <button class="control-btn" id="langBtn" onclick="toggleLanguage()">English</button>
        <button class="control-btn" onclick="toggleTheme()">🌙 / ☀️</button>
      </div>
    </header>

    <div class="container">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن وجبة..." oninput="filterMenu()">
      </div>

      <!-- شريط الأقسام (فارغ تماماً بالبداية وسيتم ملؤه حصراً بما تضيفه أنت من لوحة التحكم) -->
      <div class="categories-bar" id="categoriesBarContainer"></div>

      <!-- شبكة الوجبات (فارغة تماماً بالبداية وتستقبل وجباتك المضافة فقط) -->
      <div class="grid" id="menuGrid"></div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://admin-e3293-default-rtdb.firebaseio.com/";
    const MENU_FILE_NAME = window.location.pathname.split('/').pop().replace('.html', '') || "index"; 

    function applySavedTheme() {
      const savedTheme = localStorage.getItem('menu_theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
        document.body.classList.remove('light-mode');
      } else {
        document.body.classList.add('light-mode');
        document.body.classList.remove('dark-mode');
      }
    }

    function toggleTheme() {
      if (document.body.classList.contains('dark-mode')) {
        document.body.classList.replace('dark-mode', 'light-mode');
        localStorage.setItem('menu_theme', 'light');
      } else {
        document.body.classList.replace('light-mode', 'dark-mode');
        localStorage.setItem('menu_theme', 'dark');
      }
    }

    let currentLang = 'ar';
    function selectLanguage(lang) {
      currentLang = lang;
      document.getElementById('welcomeView').style.display = 'none';
      document.getElementById('mainMenuView').style.display = 'block';
      
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('lang', currentLang);
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
      document.getElementById('searchInput').placeholder = currentLang === 'ar' ? 'ابحث عن وجبة...' : 'Search for a meal...';

      document.querySelectorAll('[data-ar]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });
      updateSoldOutBadges();
      filterMenu();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.setAttribute('lang', currentLang);
      document.getElementById('langBtn').innerText = currentLang === 'ar' ? 'English' : 'عربي';
      document.getElementById('searchInput').placeholder = currentLang === 'ar' ? 'ابحث عن وجبة...' : 'Search for a meal...';

      document.querySelectorAll('[data-ar]').forEach(el => {
        el.innerText = el.getAttribute(`data-${currentLang}`);
      });
      updateSoldOutBadges();
      filterMenu(); 
    }

    function returnToWelcome() {
      document.getElementById('mainMenuView').style.display = 'none';
      document.getElementById('welcomeView').style.display = 'flex';
      document.dir = 'rtl';
      document.documentElement.setAttribute('lang', 'ar');
    }

    function updateSoldOutBadges() {
      const text = currentLang === 'ar' ? 'غير متوفر' : 'Unavailable';
      document.querySelectorAll('.card').forEach(card => {
        card.setAttribute('data-soldout-text', text);
      });
    }

    function appendMealsToGrid(customMeals) {
      const grid = document.getElementById('menuGrid');
      const soldOutText = currentLang === 'ar' ? 'غير متوفر' : 'Unavailable';

      customMeals.forEach(meal => {
        let existingCard = grid.querySelector(`[data-id="${meal.id}"]`);
        if (!existingCard) {
          const card = document.createElement('div');
          card.className = 'card custom-added-meal';
          card.setAttribute('data-category', meal.category ? meal.category.toLowerCase().trim() : 'other');
          card.setAttribute('data-id', meal.id);
          card.setAttribute('data-soldout-text', soldOutText);

          card.innerHTML = `
            <div class="img-wrapper"><img src="${meal.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500'}" alt="${meal.title}"></div>
            <div class="card-info">
              <div class="card-title" data-ar="${meal.title}" data-en="${meal.title}">${meal.title}</div>
              <div class="card-desc" data-ar="${meal.desc || ''}" data-en="${meal.desc || ''}">${meal.desc || ''}</div>
              <div class="card-price">${meal.price}</div>
            </div>
          `;
          grid.appendChild(card);
        }
      });
    }

    // دالة الأقسام الجديدة بالكامل: تحذف القديم وتعتمد فقط على ما يتم إضافته في قاعدة البيانات
    function renderCategoriesUI(savedCats) {
      let catsMap = new Map();
      
      // إضافة زر "الكل" افتراضياً ليعرض كافة الوجبات المضافة
      catsMap.set('all', { id: 'all', ar: 'الكل', en: 'All' });

      if (savedCats) {
        let catsArray = Array.isArray(savedCats) ? savedCats : Object.values(savedCats);
        
        catsArray.forEach(c => {
          let catId = typeof c === 'string' ? c.toLowerCase().trim() : (c.id || c.name || '').toLowerCase().trim();
          let catName = typeof c === 'string' ? c : (c.ar || c.name || c.id || '');
          if (catId && !catsMap.has(catId)) {
            catsMap.set(catId, { id: catId, ar: catName, en: catName });
          }
        });
      }

      const barContainer = document.getElementById('categoriesBarContainer');
      const currentActiveCat = activeCategory;
      barContainer.innerHTML = '';

      catsMap.forEach((catObj, catId) => {
        const isActive = currentActiveCat === catId ? 'active' : '';
        const displayName = currentLang === 'ar' ? catObj.ar : (catObj.en || catObj.ar);
        barContainer.innerHTML += `
          <button class="cat-btn ${isActive}" onclick="filterCategory('${catId}', this)" data-cat="${catId}" data-ar="${catObj.ar}" data-en="${catObj.en || catObj.ar}">
            ${displayName}
          </button>
        `;
      });
    }

    function applyStatuses(menuStatus = {}, deletedBaseMeals = [], deletedMeals = []) {
      document.querySelectorAll('.card').forEach((card) => {
        let itemId = card.getAttribute('data-id');
        if (!itemId) return;

        if ((Array.isArray(deletedMeals) && deletedMeals.includes(itemId)) || 
            (Array.isArray(deletedBaseMeals) && deletedBaseMeals.includes(itemId))) {
          if (card.style.display !== 'none') {
            card.style.display = 'none';
            card.classList.add('is-deleted-marker');
          }
          return;
        } else {
          if (card.classList.contains('is-deleted-marker')) {
            card.classList.remove('is-deleted-marker');
          }
        }

        if (menuStatus[itemId] === 'soldout') {
          if (!card.classList.contains('sold-out')) {
            card.classList.add('sold-out');
          }
        } else {
          if (card.classList.contains('sold-out')) {
            card.classList.remove('sold-out');
          }
        }
      });
      filterMenu();
    }

    let activeCategory = 'all';
    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterMenu();
    }

    function filterMenu() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      document.querySelectorAll('.card').forEach(card => {
        if (card.classList.contains('is-deleted-marker')) return;

        const itemCategory = card.getAttribute('data-category');
        const titleText = card.querySelector('.card-title').innerText.toLowerCase();
        const descText = card.querySelector('.card-desc') ? card.querySelector('.card-desc').innerText.toLowerCase() : '';

        const matchesCategory = (activeCategory === 'all' || itemCategory === activeCategory);
        const matchesSearch = titleText.includes(searchQuery) || descText.includes(searchQuery);

        const targetDisplay = (matchesCategory && matchesSearch) ? 'block' : 'none';
        if (card.style.display !== targetDisplay) {
          card.style.display = targetDisplay;
        }
      });
    }

    function renderCachedData() {
      const cachedLanding = localStorage.getItem(`cache_landing_${MENU_FILE_NAME}`);
      if (cachedLanding) {
        try { updateLandingUI(JSON.parse(cachedLanding)); } catch(e){}
      }

      const cachedMeals = localStorage.getItem(`cache_meals_${MENU_FILE_NAME}`);
      if (cachedMeals) {
        try { appendMealsToGrid(JSON.parse(cachedMeals)); } catch(e){}
      }

      const cachedCats = localStorage.getItem(`cache_cats_${MENU_FILE_NAME}`);
      if (cachedCats) {
        try { renderCategoriesUI(JSON.parse(cachedCats)); } catch(e){}
      } else {
        renderCategoriesUI([]); // لعرض زر الكل فقط في حال لم تكن هناك أقسام مخزنة
      }

      const cachedStatus = localStorage.getItem(`cache_status_${MENU_FILE_NAME}`);
      if (cachedStatus) {
        try {
          const parsed = JSON.parse(cachedStatus);
          applyStatuses(parsed.menuStatus, parsed.deletedBase, parsed.deletedCustom);
        } catch(e){}
      }
    }

    function updateLandingUI(data) {
      if (data.name) {
        document.getElementById('resTitle').innerText = data.name;
        document.getElementById('pageTitle').innerText = data.name;
        document.getElementById('brandText').innerText = data.name;
      }
      if (data.desc) document.getElementById('resDesc').innerText = data.desc;
      if (data.logo) document.getElementById('resLogoImg').src = data.logo;
      
      const locBtn = document.getElementById('locationLink');
      if (data.locationUrl) {
        locBtn.href = data.locationUrl;
        locBtn.style.display = 'flex';
      } else {
        locBtn.style.display = 'none';
      }

      if (data.socials && Array.isArray(data.socials) && data.socials.length > 0) {
        const container = document.getElementById('socialLinksContainer');
        container.innerHTML = '';
        data.socials.forEach(s => {
          if (s.url) {
            container.innerHTML += `
              <a href="${s.url}" target="_blank" class="social-icon" title="${s.platform || 'Social'}">
                <i class="${s.icon || 'fas fa-globe'}"></i>
              </a>
            `;
          }
        });
        if (container.children.length > 0) {
          document.getElementById('socialSection').style.display = 'block';
        }
      }
    }

    let isSyncing = false;

    async function backgroundSync() {
      if (isSyncing) return;
      isSyncing = true;
      try {
        const subRes = await fetch(`${API_BASE_URL}status_${MENU_FILE_NAME}.json?nocache=` + Date.now());
        const status = await subRes.json();
        document.getElementById('expiredOverlay').style.display = (status === 'expired') ? 'flex' : 'none';

        const landingRes = await fetch(`${API_BASE_URL}landing_${MENU_FILE_NAME}.json?nocache=` + Date.now());
        const landingData = await landingRes.json();
        if (landingData) {
          localStorage.setItem(`cache_landing_${MENU_FILE_NAME}`, JSON.stringify(landingData));
          updateLandingUI(landingData);
        }

        const catRes = await fetch(`${API_BASE_URL}custom_categories_${MENU_FILE_NAME}.json?nocache=` + Date.now());
        const savedCats = await catRes.json();
        localStorage.setItem(`cache_cats_${MENU_FILE_NAME}`, JSON.stringify(savedCats || []));
        renderCategoriesUI(savedCats);

        const mealsRes = await fetch(`${API_BASE_URL}custom_meals_${MENU_FILE_NAME}.json?nocache=` + Date.now());
        const customMeals = await mealsRes.json();
        if (customMeals && Array.isArray(customMeals)) {
          localStorage.setItem(`cache_meals_${MENU_FILE_NAME}`, JSON.stringify(customMeals));
          appendMealsToGrid(customMeals);
        }

        const [statusRes, delBaseRes, delRes] = await Promise.all([
          fetch(`${API_BASE_URL}items_${MENU_FILE_NAME}.json?nocache=` + Date.now()),
          fetch(`${API_BASE_URL}deleted_base_meals_${MENU_FILE_NAME}.json?nocache=` + Date.now()),
          fetch(`${API_BASE_URL}deleted_meals_${MENU_FILE_NAME}.json?nocache=` + Date.now())
        ]);

        const menuStatus = await statusRes.json() || {};
        const deletedBaseMeals = await delBaseRes.json() || [];
        const deletedMeals = await delRes.json() || [];

        const statusPayload = { menuStatus, deletedBase: deletedBaseMeals, deletedCustom: deletedMeals };
        localStorage.setItem(`cache_status_${MENU_FILE_NAME}`, JSON.stringify(statusPayload));
        
        applyStatuses(menuStatus, deletedBaseMeals, deletedMeals);

      } catch (e) {
        console.log("Background sync network error:", e);
      } finally {
        isSyncing = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      applySavedTheme();
      updateSoldOutBadges();
