<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لوحة التحكم الشاملة - جلب من جيت هب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root { 
      --bg: #f5f6fa; 
      --card-bg: #ffffff; 
      --accent: #d4af37; 
      --accent-gradient: linear-gradient(135deg, #f39c12, #d4af37);
      --text: #2f3640; 
      --text-muted: #718093; 
      --border: rgba(0, 0, 0, 0.08); 
      --success: #27ae60; 
      --danger: #ff4757; 
      --warning: #f39c12; 
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 12px; padding-bottom: 100px; overflow-x: hidden; }

    /* شاشة تسجيل الدخول والبحث عن المنيو */
    #loginScreen { display: flex; justify-content: center; align-items: center; min-height: 85vh; padding: 10px; }
    .login-card { background: var(--card-bg); border: 1px solid var(--border); padding: 25px 15px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: var(--shadow); }
    .login-card h2 { color: var(--accent); margin-bottom: 18px; font-weight: 800; font-size: 1.2rem; }
    
    .input-group { margin-bottom: 12px; text-align: right; }
    .input-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; font-weight: 600; }
    .input-group input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: #fdfdfd; color: var(--text); font-size: 16px; outline: none; transition: 0.3s; }
    .input-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15); background: #fff; }
    
    .btn { width: 100%; padding: 14px; background: var(--accent-gradient); border: none; border-radius: 12px; color: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3); transition: 0.3s; }
    .btn:active { transform: scale(0.98); }

    /* لوحة التحكم الرئيسية */
    #dashboardScreen { display: none; width: 100%; max-width: 800px; margin: 0 auto; }
    .header-dash { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; background: var(--card-bg); padding: 14px 16px; border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); }
    @media(min-width: 480px) { .header-dash { flex-direction: row; justify-content: space-between; align-items: center; } }
    .header-dash h1 { color: var(--accent); font-size: 1rem; font-weight: 800; word-break: break-all; }
    .logout-btn { background: rgba(255, 71, 87, 0.1); border: 1px solid var(--danger); padding: 10px 14px; border-radius: 10px; color: var(--danger); font-weight: 700; cursor: pointer; font-size: 0.8rem; width: 100%; }
    @media(min-width: 480px) { .logout-btn { width: auto; } }

    /* شريط التبويبات العلوي */
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .nav-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex: 0 0 auto; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-muted); font-weight: 700; font-size: 0.8rem; cursor: pointer; white-space: nowrap; text-align: center; transition: 0.3s; }
    .tab-btn.active { background: var(--accent-gradient); color: #fff; border-color: transparent; box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section-box { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
    .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
    @media(min-width: 550px) { .form-grid { grid-template-columns: 1fr 1fr; } }

    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-block; }
    .status-active { background: rgba(39, 174, 96, 0.15); color: var(--success); border: 1px solid var(--success); }
    .status-expired { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); }

    .action-btn-group { display: flex; gap: 8px; margin-top: 8px; flex-direction: column; }
    @media(min-width: 380px) { .action-btn-group { flex-direction: row; } }
    .btn-toggle-sub { border-radius: 10px; padding: 12px; font-weight: 700; cursor: pointer; border: none; flex: 1; font-size: 0.85rem; }
    
    .item-row { display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 1px solid var(--border); background: #fafbfc; margin-bottom: 8px; border-radius: 12px; }
    @media(min-width: 480px) { .item-row { flex-direction: row; justify-content: space-between; align-items: center; } }
    
    .toggle-item-btn { padding: 10px 12px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 0.75rem; width: 100%; }
    @media(min-width: 480px) { .toggle-item-btn { width: auto; } }
    
    .btn-available { background: rgba(39, 174, 96, 0.15); color: var(--success); border: 1px solid var(--success); }
    .btn-soldout { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); }
    .btn-delete { background: var(--danger); color: #fff; border: none; padding: 10px 12px; border-radius: 10px; cursor: pointer; font-weight: 700; font-size: 0.75rem; width: 100%; }
    @media(min-width: 480px) { .btn-delete { width: auto; } }

    .cat-chip { display: inline-flex; align-items: center; background: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 10px; margin: 3px; font-size: 0.8rem; font-weight: 600; box-shadow: 0 2px 5px rgba(0,0,0,0.02); word-break: break-all; }
    .cat-chip button { background: none; border: none; color: var(--danger); margin-left: 6px; cursor: pointer; font-weight: bold; font-size: 1.1rem; padding: 0 4px; }
    
    .sync-indicator { font-size: 0.75rem; color: var(--success); font-weight: 600; }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول والبحث عن اسم المنيو -->
  <div id="loginScreen">
    <div class="login-card">
      <h2>تسجيل الدخول والبحث عن المنيو</h2>
      <div class="input-group">
        <label>اسم المستخدم (يوزرنيم)</label>
        <input type="text" id="adminUsernameInput" placeholder="اكتب اسم المستخدم...">
      </div>
      <div class="input-group">
        <label>كلمة المرور (باسورد)</label>
        <input type="password" id="adminPasswordInput" placeholder="اكتب كلمة المرور...">
      </div>
      <div class="input-group">
        <label>اسم المنيو أو المطعم (مثال: restaurant1)</label>
        <input type="text" id="searchMenuNameInput" placeholder="اكتب اسم المنيو هنا...">
      </div>
      <button class="btn" onclick="searchAndLoadMenu()">دخول وبحث وجلب كلشي عنه 🔍</button>
      <p id="loginError" style="color: var(--danger); font-size: 0.8rem; margin-top: 12px; display: none;"></p>
    </div>
  </div>

  <!-- لوحة التحكم الرئيسية -->
  <div id="dashboardScreen">
    <div class="header-dash">
      <h1>إدارة منيو: <span id="activeMenuTitleDisplay" style="color:var(--accent);"></span></h1>
      <button class="logout-btn" onclick="logout()">تسجيل خروج / بحث عن منيو آخر 🔄</button>
    </div>

    <!-- شريط التبويبات -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tab-general', this)"><i class="fas fa-store"></i> الواجهة والاشتراك</button>
      <button class="tab-btn" onclick="switchTab('tab-categories', this)"><i class="fas fa-folder-open"></i> الأقسام</button>
      <button class="tab-btn" onclick="switchTab('tab-meals', this)"><i class="fas fa-utensils"></i> الوجبات</button>
      <button class="tab-btn" onclick="switchTab('tab-status', this)"><i class="fas fa-toggle-on"></i> حالة الوجبات</button>
    </div>

    <!-- 1. تبويب الواجهة والاشتراك -->
    <div id="tab-general" class="tab-content active">
      <div class="section-box">
        <div class="section-title">
          <span>حالة اشتراك المنيو</span>
          <span id="currentSubStatus" class="status-badge">جاري الفحص...</span>
        </div>
        <div class="action-btn-group">
          <button class="btn-toggle-sub" style="background: rgba(39,174,96,0.15); color: var(--success); border:1px solid var(--success);" onclick="changeSubscriptionStatus('active')">تفعيل المنيو ✅</button>
          <button class="btn-toggle-sub" style="background: rgba(255,71,87,0.15); color: var(--danger); border:1px solid var(--danger);" onclick="changeSubscriptionStatus('expired')">إيقاف (منتهي) ❌</button>
        </div>
      </div>

      <div class="section-box">
        <div class="section-title">⚙️ معلومات الواجهة والترحيب</div>
        <div class="form-grid">
          <div class="input-group"><label>اسم المطعم (عربي / عام)</label><input type="text" id="landingName"></div>
          <div class="input-group"><label>وصف المطعم الترحيبي</label><input type="text" id="landingDesc"></div>
          <div class="input-group" style="grid-column: 1 / -1;"><label>رابط الشعار (Logo URL)</label><input type="text" id="landingLogo" placeholder="https://..."></div>
          <div class="input-group" style="grid-column: 1 / -1;"><label>رابط الموقع على الخريطة (Google Maps URL)</label><input type="text" id="landingLocation" placeholder="https://maps.app.goo.gl/..."></div>
          
          <div class="input-group"><label>رابط الفيسبوك</label><input type="text" id="socialFb" placeholder="https://facebook.com/..."></div>
          <div class="input-group"><label>رابط الانستغرام</label><input type="text" id="socialInsta" placeholder="https://instagram.com/..."></div>
          <div class="input-group"><label>رابط الواتساب / التليجرام</label><input type="text" id="socialOther" placeholder="https://t.me/..."></div>
        </div>
        <button class="btn" style="margin-top: 15px;" onclick="saveLandingData()">حفظ التعديلات العامة 💾</button>
      </div>
    </div>

    <!-- 2. تبويب إدارة الأقسام -->
    <div id="tab-categories" class="tab-content">
      <div class="section-box">
        <div class="section-title">📁 إضافة قسم جديد</div>
        <div class="form-grid">
          <div class="input-group">
            <label>معرف القسم بالإنجليزية (مثل: burgers)</label>
            <input type="text" id="catIdInput" placeholder="burgers">
          </div>
          <div class="input-group">
            <label>اسم القسم بالعربي</label>
            <input type="text" id="catNameArInput" placeholder="البرجر المشوي">
          </div>
          <div class="input-group" style="grid-column: 1 / -1;">
            <label>اسم القسم بالإنجليزي</label>
            <input type="text" id="catNameEnInput" placeholder="Grilled Burgers">
          </div>
        </div>
        <button class="btn" style="margin-top: 10px; background: var(--success);" onclick="addNewCategory()">إضافة القسم ➕</button>
      </div>

      <div class="section-box">
        <div class="section-title">أقسام المنيو الحالية</div>
        <div style="margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted);">الأقسام بالعربي:</div>
        <div id="catsArChips" style="display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px;"></div>
        
        <div style="margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted);">الأقسام بالإنجليزي:</div>
        <div id="catsEnChips" style="display: flex; flex-wrap: wrap; gap: 4px;"></div>
      </div>
    </div>

    <!-- 3. تبويب الوجبات -->
    <div id="tab-meals" class="tab-content">
      <div class="section-box">
        <div class="section-title">🍔 إضافة وجبة جديدة للمنيو</div>
        <div class="form-grid">
          <div class="input-group"><label>اسم الوجبة (عربي)</label><input type="text" id="mealTitleAr"></div>
          <div class="input-group"><label>اسم الوجبة (إنجليزي)</label><input type="text" id="mealTitleEn"></div>
          
          <div class="input-group"><label>الوصف (عربي)</label><input type="text" id="mealDescAr"></div>
          <div class="input-group"><label>الوصف (إنجليزي)</label><input type="text" id="mealDescEn"></div>
          
          <div class="input-group"><label>السعر (مثلاً: 10,000 د.ع)</label><input type="text" id="mealPrice"></div>
          <div class="input-group">
            <label>القسم التابع له (معرف القسم بالإنجليزية)</label>
            <input type="text" id="mealCategory" placeholder="burgers">
          </div>
          
          <div class="input-group" style="grid-column: 1 / -1;"><label>رابط صورة الوجبة (Image URL)</label><input type="text" id="mealImg" placeholder="https://..."></div>
        </div>
        <button class="btn" style="margin-top: 15px; background: var(--success);" onclick="addNewMeal()">حفظ وإضافة الوجبة 🚀</button>
      </div>

      <div class="section-box">
        <div class="section-title">📋 الوجبات المضافة</div>
        <div id="customMealsContainer" style="max-height: 350px; overflow-y: auto;"></div>
      </div>
    </div>

    <!-- 4. تبويب حالة الوجبات -->
    <div id="tab-status" class="tab-content">
      <div class="section-box">
        <div class="section-title">
          <span>⚡ التحكم بنفاذ الوجبات فوراً</span>
          <span class="sync-indicator" id="syncIndicator">🔄 متزامن</span>
        </div>
        <div id="allMealsStatusContainer" style="max-height: 400px; overflow-y: auto;"></div>
      </div>
    </div>

  </div>

  <script>
    const API_BASE_URL = "https://admin-e3293-default-rtdb.firebaseio.com/";
    let CURRENT_MENU_NAME = "";

    let globalLanding = {};
    let customCategoriesAr = [];
    let customCategoriesEn = [];
    let customMeals = [];
    let menuStatus = {};

    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    async function searchAndLoadMenu() {
      const uInput = document.getElementById('adminUsernameInput').value.trim();
      const pInput = document.getElementById('adminPasswordInput').value.trim();
      const menuName = document.getElementById('searchMenuNameInput').value.trim().toLowerCase();
      const err = document.getElementById('loginError');

      if (!uInput || !pInput || !menuName) {
        err.innerText = "يرجى إدخال اسم المستخدم، كلمة المرور، واسم المنيو!";
        err.style.display = 'block';
        return;
      }

      try {
        // التحقق من بيانات المشرف من قاعدة البيانات (مسار admin)
        const res = await fetch(API_BASE_URL + "admin.json?nocache=" + Date.now());
        const adminData = await res.json();

        if (!adminData) {
          err.innerText = "لم يتم العثور على بيانات المشرف في قاعدة البيانات.";
          err.style.display = 'block';
          return;
        }

        if (uInput === adminData.username && pInput === adminData.password) {
          err.style.display = 'none';
          CURRENT_MENU_NAME = menuName;

          // الانتقال للوحة التحكم وعرض اسم المنيو الحالي
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('dashboardScreen').style.display = 'block';
          document.getElementById('activeMenuTitleDisplay').innerText = menuName;

          await fetchAllData();
        } else {
          err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
          err.style.display = 'block';
        }
      } catch (e) {
        err.innerText = "تعذر الاتصال بقاعدة البيانات للتحقق من الدخول!";
        err.style.display = 'block';
      }
    }

    function logout() {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('dashboardScreen').style.display = 'none';
      document.getElementById('searchMenuNameInput').value = '';
      document.getElementById('adminUsernameInput').value = '';
      document.getElementById('adminPasswordInput').value = '';
    }

    async function fetchAllData() {
      if (!CURRENT_MENU_NAME) return;
      try {
        // 1. حالة المنيو (اشتراك)
        const statusRes = await fetch(`${API_BASE_URL}status_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        const subStatus = await statusRes.json();
        updateSubStatusUI(subStatus);

        // 2. الواجهة والترحيب
        const landingRes = await fetch(`${API_BASE_URL}landing_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        globalLanding = await landingRes.json() || {};
        populateLandingForm(globalLanding);

        // 3. الأقسام
        const catArRes = await fetch(`${API_BASE_URL}custom_categories_ar_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        customCategoriesAr = await catArRes.json() || [];
        
        const catEnRes = await fetch(`${API_BASE_URL}custom_categories_en_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        customCategoriesEn = await catEnRes.json() || [];
        renderCategoriesChips();

        // 4. الوجبات
        const mealsRes = await fetch(`${API_BASE_URL}custom_meals_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        customMeals = await mealsRes.json() || [];
        renderCustomMealsList();

        // 5. حالة نفاذ الوجبات
        const itemStatusRes = await fetch(`${API_BASE_URL}items_${CURRENT_MENU_NAME}.json?nocache=` + Date.now());
        menuStatus = await itemStatusRes.json() || {};
        renderStatusList();

      } catch(e) {
        console.log("خطأ في جلب بيانات المنيو:", e);
      }
    }

    function updateSubStatusUI(status) {
      const badge = document.getElementById('currentSubStatus');
      if (status === 'expired') {
        badge.className = 'status-badge status-expired';
        badge.innerText = 'متوقف (Expired)';
      } else {
        badge.className = 'status-badge status-active';
        badge.innerText = 'نشط (Active)';
      }
    }

    async function changeSubscriptionStatus(status) {
      await fetch(`${API_BASE_URL}status_${CURRENT_MENU_NAME}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(status)
      });
      updateSubStatusUI(status);
      alert("تم تحديث حالة اشتراك هذا المنيو!");
    }

    function populateLandingForm(data) {
      if (document.activeElement.tagName === 'INPUT') return;
      document.getElementById('landingName').value = data.name || "";
      document.getElementById('landingDesc').value = data.desc || "";
      document.getElementById('landingLogo').value = data.logo || "";
      document.getElementById('landingLocation').value = data.locationUrl || "";
      
      if (data.socials && Array.isArray(data.socials)) {
        data.socials.forEach(s => {
          if (s.platform === 'Facebook') document.getElementById('socialFb').value = s.url || "";
          if (s.platform === 'Instagram') document.getElementById('socialInsta').value = s.url || "";
          if (s.platform === 'Telegram' || s.platform === 'WhatsApp') document.getElementById('socialOther').value = s.url || "";
        });
      }
    }

    async function saveLandingData() {
      const name = document.getElementById('landingName').value.trim();
      const desc = document.getElementById('landingDesc').value.trim();
      const logo = document.getElementById('landingLogo').value.trim();
      const locationUrl = document.getElementById('landingLocation').value.trim();
      
      const fb = document.getElementById('socialFb').value.trim();
      const insta = document.getElementById('socialInsta').value.trim();
      const other = document.getElementById('socialOther').value.trim();

      let socials = [];
      if (fb) socials.push({ platform: "Facebook", icon: "fab fa-facebook-f", url: fb });
      if (insta) socials.push({ platform: "Instagram", icon: "fab fa-instagram", url: insta });
      if (other) socials.push({ platform: "Telegram", icon: "fab fa-telegram-plane", url: other });

      const payload = { name, desc, logo, locationUrl, socials };

      await fetch(`${API_BASE_URL}landing_${CURRENT_MENU_NAME}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("تم حفظ بيانات المنيو بنجاح!");
    }

    async function addNewCategory() {
      const id = document.getElementById('catIdInput').value.trim().toLowerCase();
      const nameAr = document.getElementById('catNameArInput').value.trim();
      const nameEn = document.getElementById('catNameEnInput').value.trim();

      if (!id || !nameAr) {
        alert("يرجى إدخال معرف القسم واسمه بالعربي!");
        return;
      }

      if (!customCategoriesAr.some(c => (typeof c === 'string' ? c === id : c.id === id))) {
        customCategoriesAr.push({ id, name: nameAr });
      }
      if (!customCategoriesEn.some(c => (typeof c === 'string' ? c === id : c.id === id))) {
        customCategoriesEn.push({ id, name: nameEn || nameAr });
      }

      await Promise.all([
        fetch(`${API_BASE_URL}custom_categories_ar_${CURRENT_MENU_NAME}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(customCategoriesAr)
        }),
        fetch(`${API_BASE_URL}custom_categories_en_${CURRENT_MENU_NAME}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(customCategoriesEn)
        })
      ]);

      document.getElementById('catIdInput').value = '';
      document.getElementById('catNameArInput').value = '';
      document.getElementById('catNameEnInput').value = '';

      renderCategoriesChips();
      alert("تمت إضافة القسم بنجاح!");
    }

    function renderCategoriesChips() {
      const arContainer = document.getElementById('catsArChips');
      const enContainer = document.getElementById('catsEnChips');
      
      arContainer.innerHTML = '';
      enContainer.innerHTML = '';

      customCategoriesAr.forEach((c) => {
        let name = typeof c === 'string' ? c : (c.name || c.id);
        let id = typeof c === 'string' ? c : c.id;
        arContainer.innerHTML += `<div class="cat-chip"><span>${name} (${id})</span><button onclick="deleteCategory('${id}')">×</button></div>`;
      });

      customCategoriesEn.forEach((c) => {
        let name = typeof c === 'string' ? c : (c.name || c.id);
        let id = typeof c === 'string' ? c : c.id;
        enContainer.innerHTML += `<div class="cat-chip">${name} (${id})</div>`;
      });
    }

    async function deleteCategory(catId) {
      if (!confirm("هل أنت متأكد من حذف هذا القسم؟")) return;
      customCategoriesAr = customCategoriesAr.filter(c => (typeof c === 'string' ? c !== catId : c.id !== catId));
      customCategoriesEn = customCategoriesEn.filter(c => (typeof c === 'string' ? c !== catId : c.id !== catId));

      await Promise.all([
        fetch(`${API_BASE_URL}custom_categories_ar_${CURRENT_MENU_NAME}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(customCategoriesAr)
        }),
        fetch(`${API_BASE_URL}custom_categories_en_${CURRENT_MENU_NAME}.json`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(customCategoriesEn)
        })
      ]);
      renderCategoriesChips();
    }

    async function addNewMeal() {
      const titleAr = document.getElementById('mealTitleAr').value.trim();
      const titleEn = document.getElementById('mealTitleEn').value.trim();
      const descAr = document.getElementById('mealDescAr').value.trim();
      const descEn = document.getElementById('mealDescEn').value.trim();
      const price = document.getElementById('mealPrice').value.trim();
      const category = document.getElementById('mealCategory').value.trim().toLowerCase();
      const img = document.getElementById('mealImg').value.trim();

      if (!titleAr || !category) {
        alert("يرجى إدخال اسم الوجبة بالعربي والقسم!");
        return;
      }

      const newMeal = {
        id: "meal_" + Date.now(),
        title: titleAr,
        title_ar: titleAr,
        title_en: titleEn || titleAr,
        desc: descAr,
        desc_ar: descAr,
        desc_en: descEn || descAr,
        price,
        category,
        img: img || "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500"
      };

      customMeals.push(newMeal);

      await fetch(`${API_BASE_URL}custom_meals_${CURRENT_MENU_NAME}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(customMeals)
      });

      document.getElementById('mealTitleAr').value = '';
      document.getElementById('mealTitleEn').value = '';
      document.getElementById('mealDescAr').value = '';
      document.getElementById('mealDescEn').value = '';
      document.getElementById('mealPrice').value = '';
      document.getElementById('mealImg').value = '';

      renderCustomMealsList();
      renderStatusList();
      alert("تمت إضافة الوجبة بنجاح!");
    }

    function renderCustomMealsList() {
      const container = document.getElementById('customMealsContainer');
      container.innerHTML = '';

      if (customMeals.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 15px;">لا توجد وجبات مضافة.</p>';
        return;
      }

      customMeals.forEach(meal => {
        container.innerHTML += `
          <div class="item-row">
            <div>
              <strong>${meal.title_ar || meal.title}</strong>
              <span style="display:block; font-size:0.75rem; color:var(--text-muted);">القسم: ${meal.category} | السعر: ${meal.price}</span>
            </div>
            <button class="btn-delete" onclick="deleteCustomMeal('${meal.id}')">حذف</button>
          </div>
        `;
      });
    }

    async function deleteCustomMeal(mealId) {
      if (!confirm("هل أنت متأكد من حذف الوجبة؟")) return;
      customMeals = customMeals.filter(m => m.id !== mealId);

      await fetch(`${API_BASE_URL}custom_meals_${CURRENT_MENU_NAME}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(customMeals)
      });

      renderCustomMealsList();
      renderStatusList();
    }

    function renderStatusList() {
      const container = document.getElementById('allMealsStatusContainer');
      container.innerHTML = '';

      if (customMeals.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding: 15px;">لا توجد وجبات للتحكم بحالتها.</p>';
        return;
      }

      customMeals.forEach(meal => {
        let isSoldOut = menuStatus[meal.id] === 'soldout';
        container.innerHTML += `
          <div class="item-row">
            <div>
              <strong>${meal.title_ar || meal.title}</strong>
              <span style="display:block; font-size:0.75rem; color:var(--text-muted);">القسم: ${meal.category}</span>
            </div>
            <button class="toggle-item-btn ${isSoldOut ? 'btn-soldout' : 'btn-available'}" onclick="toggleMealSoldOut('${meal.id}')">
              ${isSoldOut ? 'غير متوفر (Sold Out) 🔴' : 'متوفر (Available) 🟢'}
            </button>
          </div>
        `;
      });
    }

    async function toggleMealSoldOut(mealId) {
      if (menuStatus[mealId] === 'soldout') {
        delete menuStatus[mealId];
      } else {
        menuStatus[mealId] = 'soldout';
      }

      await fetch(`${API_BASE_URL}items_${CURRENT_MENU_NAME}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(menuStatus)
      });

      renderStatusList();
    }
  </script>
</body>
</html>
