<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة صاحب المطعم - إدارة التوفر والأسعار</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #ffffff;
      --accent: #d4af37;
      --text: #2f3640;
      --text-muted: #718093;
      --success: #27ae60;
      --danger: #ff4757;
      --border: rgba(0, 0, 0, 0.08);
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; max-width: 600px; margin: 0 auto; }

    #loginBox { background: var(--card); padding: 25px 20px; border-radius: 16px; margin-top: 40px; box-shadow: var(--shadow); border: 1px solid var(--border); text-align: center; }
    #loginBox h2 { color: var(--accent); margin-bottom: 15px; font-size: 1.2rem; }
    .input-group { margin-bottom: 12px; text-align: right; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); outline: none; font-size: 1rem; }
    .btn-login { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; }

    #mainApp { display: none; }
    .header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 15px; border-radius: 14px; margin-bottom: 15px; box-shadow: var(--shadow); }
    .header h3 { font-size: 1.1rem; color: var(--accent); }
    .btn-logout { background: rgba(255, 71, 87, 0.1); color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .meal-card { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
    .meal-top { display: flex; justify-content: space-between; align-items: center; }
    .meal-info strong { display: block; font-size: 1rem; }
    
    .price-box { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
    .price-input { width: 110px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 0.85rem; font-weight: bold; color: var(--accent); }
    .btn-save-price { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .btn-save-price:active { opacity: 0.8; }

    .status-btn { padding: 8px 14px; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; font-size: 0.85rem; transition: 0.2s; white-space: nowrap; }
    .btn-available { background: rgba(39, 174, 96, 0.15); color: var(--success); border: 1px solid var(--success); }
    .btn-soldout { background: rgba(255, 71, 87, 0.15); color: var(--danger); border: 1px solid var(--danger); }
  </style>
</head>
<body>

  <!-- شاشة تسجيل الدخول المطابقة لنفس يوزرات قاعدة البيانات -->
  <div id="loginBox">
    <h2>تسجيل دخول صاحب المطعم 🔑</h2>
    <div class="input-group">
      <label>اسم المستخدم</label>
      <input type="text" id="userInput" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="passInput" placeholder="أدخل كلمة المرور">
    </div>
    <div class="input-group">
      <label>اسم المنيو</label>
      <input type="text" id="menuNameInput" placeholder="مثال: restaurant1">
    </div>
    <button class="btn-login" onclick="login()">دخول 🚀</button>
    <p id="errMsg" style="color:var(--danger); font-size:0.85rem; margin-top:10px; display:none;"></p>
  </div>

  <!-- الواجهة الرئيسية -->
  <div id="mainApp">
    <div class="header">
      <div>
        <h3>منيو: <span id="displayMenuName"></span></h3>
        <small style="color:var(--text-muted)">التحكم بالتوفر والأسعار</small>
      </div>
      <button class="btn-logout" onclick="logout()">خروج 🔄</button>
    </div>

    <div id="mealsList"></div>
  </div>

  <script>
    const API_BASE_URL = "https://admin-e3293-default-rtdb.firebaseio.com/";
    let CURRENT_MENU = "";
    let mealsData = [];
    let itemsStatus = {};

    async function login() {
      const usernameInput = document.getElementById('userInput').value.trim();
      const passwordInput = document.getElementById('passInput').value.trim();
      const menuInput = document.getElementById('menuNameInput').value.trim().toLowerCase();
      const err = document.getElementById('errMsg');

      if (!usernameInput || !passwordInput || !menuInput) {
        err.innerText = "يرجى كتابة جميع البيانات!";
        err.style.display = 'block';
        return;
      }

      try {
        const res = await fetch(`${API_BASE_URL}admin.json?nocache=${Date.now()}`);
        const adminUsers = await res.json();

        let isValidUser = false;

        if (adminUsers) {
          Object.keys(adminUsers).forEach(key => {
            const u = adminUsers[key];
            if (u && u.username === usernameInput && u.password === passwordInput) {
              isValidUser = true;
            }
          });
        }

        if (isValidUser) {
          CURRENT_MENU = menuInput;
          document.getElementById('displayMenuName').innerText = CURRENT_MENU;

          document.getElementById('loginBox').style.display = 'none';
          document.getElementById('mainApp').style.display = 'block';

          loadMenuData();
        } else {
          err.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
          err.style.display = 'block';
        }
      } catch (e) {
        err.innerText = "حدث خطأ أثناء الاتصال بقاعدة البيانات!";
        err.style.display = 'block';
      }
    }

    async function loadMenuData() {
      try {
        const [mealsRes, statusRes] = await Promise.all([
          fetch(`${API_BASE_URL}custom_meals_${CURRENT_MENU}.json?nocache=${Date.now()}`),
          fetch(`${API_BASE_URL}items_${CURRENT_MENU}.json?nocache=${Date.now()}`)
        ]);

        mealsData = await mealsRes.json() || [];
        itemsStatus = await statusRes.json() || {};

        renderMeals();
      } catch (e) {
        alert("تعذر جلب البيانات، تأكد من اسم المنيو!");
      }
    }

    function renderMeals() {
      const container = document.getElementById('mealsList');
      container.innerHTML = '';

      if (mealsData.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-muted)">لا توجد وجبات مضافة لهذا المنيو.</p>';
        return;
      }

      mealsData.forEach((meal, index) => {
        const isSoldOut = itemsStatus[meal.id] === 'soldout';
        
        container.innerHTML += `
          <div class="meal-card">
            <div class="meal-top">
              <div class="meal-info">
                <strong>${meal.title_ar || meal.title}</strong>
              </div>
              <button class="status-btn ${isSoldOut ? 'btn-soldout' : 'btn-available'}" onclick="toggleStatus('${meal.id}')">
                ${isSoldOut ? 'غير متوفر 🔴' : 'متوفر 🟢'}
              </button>
            </div>
            
            <div class="price-box">
              <span style="font-size:0.85rem; color:var(--text-muted);">السعر:</span>
              <input type="text" class="price-input" id="price_input_${index}" value="${meal.price || ''}" placeholder="السعر">
              <button class="btn-save-price" onclick="updatePrice('${meal.id}', ${index})">حفظ 💾</button>
            </div>
          </div>
        `;
      });
    }

    async function updatePrice(mealId, index) {
      const newPrice = document.getElementById(`price_input_${index}`).value.trim();

      const mealIndex = mealsData.findIndex(m => m.id === mealId);
      if (mealIndex !== -1) {
        mealsData[mealIndex].price = newPrice;

        try {
          await fetch(`${API_BASE_URL}custom_meals_${CURRENT_MENU}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(mealsData)
          });
          alert('تم تحديث السعر بنجاح! 🚀');
        } catch (e) {
          alert('حدث خطأ أثناء حفظ السعر الجديد!');
        }
      }
    }

    async function toggleStatus(mealId) {
      if (itemsStatus[mealId] === 'soldout') {
        delete itemsStatus[mealId];
      } else {
        itemsStatus[mealId] = 'soldout';
      }

      await fetch(`${API_BASE_URL}items_${CURRENT_MENU}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(itemsStatus)
      });

      renderMeals();
    }

    function logout() {
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('userInput').value = '';
      document.getElementById('passInput').value = '';
    }
  </script>
</body>
</html>
